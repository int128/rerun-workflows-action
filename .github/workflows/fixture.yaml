name: fixture

on:
  pull_request:
    # This must be same as ts.yaml
    paths:
      - src/**
      - tests/**
      - '*.json'
      - '*.yaml'
      - .github/workflows/ts.yaml
      - .github/workflows/fixture.yaml
  push:
    # This must be same as ts.yaml
    paths:
      - src/**
      - tests/**
      - '*.json'
      - '*.yaml'
      - .github/workflows/ts.yaml
    branches:
      - main
      - int128/Support-push-event

jobs:
  success-on-rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: test "$GITHUB_RUN_ATTEMPT" = 2
